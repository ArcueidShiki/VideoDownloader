name: macOS and repository hygiene
on:
  pull_request:
  push:
    branches: [main, fix/ytdlp-integration]
permissions:
  contents: read
jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/repo_hygiene.py check
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path macos
      - run: scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AnyDownloader-macOS
          path: release/*.zip
      - run: python3 scripts/repo_hygiene.py check
