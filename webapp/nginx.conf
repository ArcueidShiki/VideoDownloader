# Cloudflare handles SSL — origin only needs port 80
# Cloudflare SSL/TLS mode: Flexible (or Full with Cloudflare origin cert)
server {
    listen 80;
    listen [::]:80;
    # Replace with your deployment domain + origin IP at install time.
    server_name __DOMAIN__ __SERVER_IP__;

    root __DIST_PATH__;
    index index.html;

    # Cache hashed static assets indefinitely
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|ico|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html must not be cached
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Expensive API endpoint — yt-dlp spawns here
    location = /api/info {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All other API routes — large file downloads stream through here
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # WebSocket — download progress stream
    location /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
