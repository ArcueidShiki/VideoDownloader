<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070b12" />

    <!-- ── Primary SEO ────────────────────────────────────────────────── -->
    <title>VideoDownloader - Free Online Video Downloader · 1000+ Sites</title>
    <meta name="description" content="Free online video downloader. No account required. Paste any video URL, choose quality or audio-only, and save. Fast, private, and free." />
    <meta name="keywords" content="video downloader, free video download, online video downloader, mp4 downloader, audio downloader, download video online, video to mp3, yt-dlp" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="author" content="VideoDownloader" />

    <!-- ── Canonical & hreflang ───────────────────────────────────────── -->
    <!-- TODO: replace https://yourdomain.com with your actual domain -->
    <link rel="canonical" href="https://yourdomain.com/" />
    <link rel="alternate" hreflang="en"    href="https://yourdomain.com/" />
    <link rel="alternate" hreflang="zh-CN" href="https://yourdomain.com/" />
    <link rel="alternate" hreflang="zh-TW" href="https://yourdomain.com/" />
    <link rel="alternate" hreflang="ja"    href="https://yourdomain.com/" />
    <link rel="alternate" hreflang="es"    href="https://yourdomain.com/" />
    <link rel="alternate" hreflang="fr"    href="https://yourdomain.com/" />
    <link rel="alternate" hreflang="de"    href="https://yourdomain.com/" />
    <link rel="alternate" hreflang="ar"    href="https://yourdomain.com/" />
    <link rel="alternate" hreflang="x-default" href="https://yourdomain.com/" />

    <!-- ── Open Graph ─────────────────────────────────────────────────── -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://yourdomain.com/" />
    <meta property="og:title"       content="VideoDownloader - Free Online Video Downloader" />
    <meta property="og:description" content="Free online video downloader. No account required. Paste any URL, choose quality or audio-only, and save instantly." />
    <meta property="og:image"       content="https://yourdomain.com/og-image.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name"   content="VideoDownloader" />
    <meta property="og:locale"      content="en_US" />

    <!-- ── Twitter Card ───────────────────────────────────────────────── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="VideoDownloader - Free Online Video Downloader" />
    <meta name="twitter:description" content="Download any video free from 1000+ sites. No account needed. Choose quality, audio-only, or merged MP4." />
    <meta name="twitter:image"       content="https://yourdomain.com/og-image.png" />

    <!-- ── Icons & PWA ────────────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VideoDownloader" />

    <!-- ── Structured Data (JSON-LD) ──────────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "VideoDownloader",
      "url": "https://yourdomain.com/",
      "description": "Free online video downloader supporting 1000+ video and social media sites. No account required.",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "Web",
      "browserRequirements": "Requires JavaScript",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Download videos from 1000+ sites",
        "Audio-only download",
        "Multiple quality options",
        "No account required",
        "Free to use"
      ]
    }
    </script>

    <!--
      Monetag ad scripts are injected at runtime by the app when VITE_AD_MODE=live.
      See src/App.tsx (useMonetag hook) and .env.prod for configuration.
    -->
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>

</html>
